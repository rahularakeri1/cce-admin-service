server:
  port: 8085

spring:
  application:
    name: cce-admin-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ccedb}
    username: ${DATABASE_USERNAME:cce_user}
    password: ${DATABASE_PASSWORD:cce_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_admin
    baseline-on-migrate: true
    baseline-version: ${CCE_FLYWAY_BASELINE_VERSION:0}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8081/realms/cce}
          jwk-set-uri: ${JWT_ISSUER:http://localhost:8081/realms/cce}/protocol/openid-connect/certs

jwt:
  audience: ${JWT_AUDIENCE:account}
  roles-claim-path: ${JWT_ROLES_CLAIM_PATH:realm_access.roles}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_TARGET_REALM:cce}
  # Admin API credentials. If admin-client-secret is set -> client_credentials grant for a
  # service-account client in `realm` (use this in real environments). Otherwise -> password grant
  # as admin-username in `admin-realm` (local dev: the Keycloak master admin).
  admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  # Invitation email (VERIFY_EMAIL + UPDATE_PASSWORD): link lifetime, and where the user lands after
  # completing it. The redirect must be a valid redirect URI of invite-client-id in Keycloak.
  invite-lifespan-seconds: ${KEYCLOAK_INVITE_LIFESPAN_SECONDS:259200}
  invite-client-id: ${KEYCLOAK_INVITE_CLIENT_ID:cce-admin-ui}
  invite-redirect-uri: ${KEYCLOAK_INVITE_REDIRECT_URI:http://localhost:3002/}

gateway:
  # gateway-service's sync endpoint — see client/GatewaySyncClient. Local: scripts/run-gateway-local.sh
  url: ${GATEWAY_URL:http://localhost:8090}
  sync-timeout-seconds: ${GATEWAY_SYNC_TIMEOUT_SECONDS:20}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.openphc.cce.admin: INFO
